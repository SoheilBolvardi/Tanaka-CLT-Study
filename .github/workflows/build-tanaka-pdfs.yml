name: Build revised Tanaka PDFs
on:
  push:
    branches:
      - tanaka-corrected-edition-2026
    paths:
      - 'exposition/*.tex'
      - 'report/*.tex'
      - '.github/workflows/build-tanaka-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures
      - name: Compile PDFs
        run: |
          set -e
          for dir in exposition report; do
            for tex in "$dir"/*.tex; do
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory "$dir" "$tex" >/dev/null
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory "$dir" "$tex" >/dev/null
            done
          done
      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exposition/*.pdf report/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild PDFs from expanded corrected LaTeX sources"
            git push
          fi
